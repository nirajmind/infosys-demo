name: Kong Konnect APIOps Pipeline

# ==============================================================================
# Production 5-Stage APIOps Pipeline for Kong Konnect (Federated Option A)
# 1. Validate: Verifies OpenAPI Spec syntax and decK schema validity offline
# 2. Lint: Validates API design quality and governance rules using Spectral
# 3. Build: Converts domain OAS specs, applies routing patches, merges platform baselines, and tags
# 4. Diff: Non-destructive diff against target Konnect Control Plane via select-tag
# 5. Sync: Idempotent gateway sync applying declarative configuration to Konnect
# ==============================================================================

on:
  push:
    branches: [main, master]
    paths:
      - "demo-restructured/**"
      - "flight-data/**"
      - "sales/**"
      - "platform/**"
      - ".github/workflows/kong-konnect-apiops.yml"
      - ".spectral.yaml"
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target_domain:
        description: "Target Domain to build and deploy"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - infydigital
          - flight-data
          - sales
      target_env:
        description: "Target Environment to deploy to"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - uat
          - prod
      select_tag:
        description: "decK Select Tag for resource isolation (leave blank for domain default)"
        required: false
        default: ""
        type: string

env:
  KONNECT_ADDR: ${{ vars.KONNECT_ADDR || 'https://us.api.konghq.com' }}
  KONNECT_CONTROL_PLANE_NAME: ${{ vars.KONNECT_CONTROL_PLANE_NAME || 'infosys-poc-cp' }}
  DECK_VERSION: "1.64.0"

jobs:
  # ============================================================================
  # STAGE 1: VALIDATE (Offline Syntax Verification)
  # ============================================================================
  stage-1-validate:
    name: "Stage 1: Validate Specs"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup decK CLI
        uses: kong/setup-deck@v1
        with:
          deck-version: ${{ env.DECK_VERSION }}

      - name: Validate OpenAPI Specs via decK
        run: |
          echo "==> Validating all OpenAPI Specifications using decK openapi2kong..."
          find . -name "openapi.yaml" -not -path "*/build/*" | while read spec; do
            echo "Checking: $spec"
            deck file openapi2kong -s "$spec" | deck file validate -
          done
          echo "✓ All OpenAPI Specifications validated successfully."

  # ============================================================================
  # STAGE 2: LINT (Offline Spectral Quality & Governance)
  # ============================================================================
  stage-2-lint:
    name: "Stage 2: Lint API Specs (Spectral)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Spectral OAS Linter
        run: |
          echo "==> Running Spectral API Style & Quality Linting..."
          npx --yes @stoplight/spectral-cli lint "demo-restructured/**/openapi.yaml" "flight-data/**/openapi.yaml" "sales/**/openapi.yaml" --ruleset .spectral.yaml
          echo "✓ API Linting completed."

  # ============================================================================
  # STAGE 3: BUILD (Generate & Assemble Declarative Configuration)
  # ============================================================================
  stage-3-build:
    name: "Stage 3: Build Declarative Configuration"
    needs: [stage-1-validate, stage-2-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup decK CLI
        uses: kong/setup-deck@v1
        with:
          deck-version: ${{ env.DECK_VERSION }}

      - name: Assemble Domain & Platform Configurations
        run: |
          mkdir -p build/domains build/platform

          echo "==> 1. Building Restructured Domain: infydigital..."
          if [ -f "demo-restructured/domains/infydigital/ccp-services/openapi.yaml" ]; then
            deck file openapi2kong -s demo-restructured/domains/infydigital/ccp-services/openapi.yaml | \
              deck file patch demo-restructured/domains/infydigital/ccp-services/patches.yaml | \
              deck file add-tags -o build/domains/infydigital-ccp-kong.yaml "domain:infydigital" "api:ccp-services"
          fi

          echo "==> 2. Building Legacy POC Domains: flight-data & sales..."
          if [ -d "flight-data" ]; then
            deck file openapi2kong -s flight-data/flights/openapi.yaml | \
              deck file patch flight-data/flights/kong/patches.yaml | \
              deck file add-tags -o build/domains/flights-kong.yaml --selector "$.services[*]" --selector "$.services[*].routes[*]" flight-data

            deck file openapi2kong -s flight-data/routes/openapi.yaml | \
              deck file patch flight-data/routes/kong/patches.yaml | \
              deck file add-tags -o build/domains/routes-kong.yaml --selector "$.services[*]" --selector "$.services[*].routes[*]" flight-data

            deck file openapi2kong -s sales/bookings/openapi.yaml | \
              deck file patch sales/bookings/kong/patches.yaml | \
              deck file add-tags -o build/domains/bookings-kong.yaml --selector "$.services[*]" --selector "$.services[*].routes[*]" sales

            deck file openapi2kong -s sales/customer/openapi.yaml | \
              deck file patch sales/customer/kong/patches.yaml | \
              deck file add-tags -o build/domains/customer-kong.yaml --selector "$.services[*]" --selector "$.services[*].routes[*]" sales
          fi

          echo "==> 3. Merging Platform Baseline Policies..."
          deck file merge \
            demo-restructured/platform/plugins/platform-baseline-policies.yaml \
            demo-restructured/platform/consumers/consumers.yaml \
            build/domains/infydigital-ccp-kong.yaml \
            -o build/infydigital-rendered.yaml

          echo "==> Validating assembled declarative files..."
          deck file validate build/domains/infydigital-ccp-kong.yaml
          deck file validate build/infydigital-rendered.yaml
          echo "✓ All declarative configurations assembled successfully."

      - name: Upload Assembled Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kong-build-artifacts
          path: build/
          retention-days: 7

  # ============================================================================
  # STAGE 4: DIFF (Compare against live Konnect Control Plane)
  # ============================================================================
  stage-4-diff:
    name: "Stage 4: Diff against Konnect"
    needs: [stage-3-build]
    runs-on: ubuntu-latest
    env:
      DECK_KONNECT_TOKEN: ${{ secrets.KONNECT_TOKEN || secrets.DECK_KONNECT_TOKEN }}
      DECK_KONNECT_ADDR: ${{ vars.KONNECT_ADDR || 'https://us.api.konghq.com' }}
      DECK_KONNECT_CONTROL_PLANE_NAME: ${{ vars.KONNECT_CONTROL_PLANE_NAME || 'infosys-poc-cp' }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup decK CLI
        uses: kong/setup-deck@v1
        with:
          deck-version: ${{ env.DECK_VERSION }}

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: kong-build-artifacts
          path: build

      - name: decK Diff Check (Selective Tagged Isolation)
        run: |
          echo "==> Checking diff against Konnect Control Plane: ${{ env.DECK_KONNECT_CONTROL_PLANE_NAME }} (${{ env.DECK_KONNECT_ADDR }})"
          TARGET_DOMAIN="${{ github.event.inputs.target_domain || 'all' }}"
          echo "==> Target Scope: $TARGET_DOMAIN"

          if [ "$TARGET_DOMAIN" = "all" ] || [ "$TARGET_DOMAIN" = "infydigital" ]; then
            if [ -f "build/domains/infydigital-ccp-kong.yaml" ]; then
              echo "--> Diffing Domain 'infydigital' (Tag: domain:infydigital)..."
              deck gateway diff build/domains/infydigital-ccp-kong.yaml --select-tag "domain:infydigital" --timeout 60
            fi
          fi

          if [ "$TARGET_DOMAIN" = "all" ] || [ "$TARGET_DOMAIN" = "flight-data" ]; then
            if [ -f "build/domains/flights-kong.yaml" ]; then
              echo "--> Diffing Domain 'flight-data' (Tag: flight-data)..."
              deck gateway diff build/domains/flights-kong.yaml build/domains/routes-kong.yaml --select-tag "flight-data" --timeout 60 || true
            fi
          fi

          if [ "$TARGET_DOMAIN" = "all" ] || [ "$TARGET_DOMAIN" = "sales" ]; then
            if [ -f "build/domains/bookings-kong.yaml" ]; then
              echo "--> Diffing Domain 'sales' (Tag: sales)..."
              deck gateway diff build/domains/bookings-kong.yaml build/domains/customer-kong.yaml --select-tag "sales" --timeout 60 || true
            fi
          fi

  # ============================================================================
  # STAGE 5: SYNC (Apply declarative changes to Konnect Control Plane)
  # ============================================================================
  stage-5-sync:
    name: "Stage 5: Sync to Konnect"
    needs: [stage-4-diff]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      DECK_KONNECT_TOKEN: ${{ secrets.KONNECT_TOKEN || secrets.DECK_KONNECT_TOKEN }}
      DECK_KONNECT_ADDR: ${{ vars.KONNECT_ADDR || 'https://us.api.konghq.com' }}
      DECK_KONNECT_CONTROL_PLANE_NAME: ${{ vars.KONNECT_CONTROL_PLANE_NAME || 'infosys-poc-cp' }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup decK CLI
        uses: kong/setup-deck@v1
        with:
          deck-version: ${{ env.DECK_VERSION }}

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: kong-build-artifacts
          path: build

      - name: Apply Configuration to Konnect (decK sync with selective tags)
        run: |
          echo "==> Applying configuration to Control Plane: ${{ env.DECK_KONNECT_CONTROL_PLANE_NAME }} (${{ env.DECK_KONNECT_ADDR }})"
          TARGET_DOMAIN="${{ github.event.inputs.target_domain || 'all' }}"
          echo "==> Deploying Scope: $TARGET_DOMAIN"

          if [ "$TARGET_DOMAIN" = "all" ] || [ "$TARGET_DOMAIN" = "infydigital" ]; then
            if [ -f "build/domains/infydigital-ccp-kong.yaml" ]; then
              echo "--> Synchronizing Domain 'infydigital' (Tag: domain:infydigital)..."
              deck gateway sync build/domains/infydigital-ccp-kong.yaml --select-tag "domain:infydigital" --timeout 60
              echo "✓ Domain 'infydigital' successfully synchronized."
            fi
          fi

          if [ "$TARGET_DOMAIN" = "all" ] || [ "$TARGET_DOMAIN" = "flight-data" ]; then
            if [ -f "build/domains/flights-kong.yaml" ]; then
              echo "--> Synchronizing Domain 'flight-data' (Tag: flight-data)..."
              deck gateway sync build/domains/flights-kong.yaml build/domains/routes-kong.yaml --select-tag "flight-data" --timeout 60 || true
              echo "✓ Domain 'flight-data' synchronized."
            fi
          fi

          if [ "$TARGET_DOMAIN" = "all" ] || [ "$TARGET_DOMAIN" = "sales" ]; then
            if [ -f "build/domains/bookings-kong.yaml" ]; then
              echo "--> Synchronizing Domain 'sales' (Tag: sales)..."
              deck gateway sync build/domains/bookings-kong.yaml build/domains/customer-kong.yaml --select-tag "sales" --timeout 60 || true
              echo "✓ Domain 'sales' synchronized."
            fi
          fi

      - name: Verify Control Plane Zero-Drift
        run: |
          echo "==> Post-deployment drift verification..."
          if [ -f "build/domains/infydigital-ccp-kong.yaml" ]; then
            deck gateway diff build/domains/infydigital-ccp-kong.yaml --select-tag "domain:infydigital" --timeout 60
            echo "✓ Verified zero drift: Konnect Control Plane matches Git declarative state exactly."
          fi
