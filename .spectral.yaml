extends: ["spectral:oas"]
rules:
  # In Jason's sample repo, examples are formatted as multi-line pipe strings (|),
  # which Spectral parses as strings rather than JSON arrays/objects.
  # We set this to warn so the pipeline demonstrates governance without breaking on sample formatting.
  oas3-valid-media-example: warn
  operation-description: warn
  info-contact: warn
  info-description: warn
  operation-operationId: warn
  operation-tags: warn
  operation-tag-defined: warn
